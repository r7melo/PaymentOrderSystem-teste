services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth_db:
    image: postgres:16
    container_name: auth_db
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    ports: ["5436:5432"]
    volumes:
      - auth_db_data:/var/lib/postgresql/data
      - ./auth_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  accounts_db:
    image: postgres:16
    container_name: accounts_db
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: accounts
      POSTGRES_PASSWORD: accounts
    ports: ["5433:5432"]
    volumes:
      - accounts_db_data:/var/lib/postgresql/data
      - ./accounts_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./accounts_db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounts -d accounts"]
      interval: 5s
      timeout: 5s
      retries: 10

  orders_db:
    image: postgres:16
    container_name: orders_db
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports: ["5434:5432"]
    volumes:
      - orders_db_data:/var/lib/postgresql/data
      - ./orders_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  confirmation_db:
    image: postgres:16
    container_name: confirmation_db
    environment:
      POSTGRES_DB: confirmation
      POSTGRES_USER: confirmation
      POSTGRES_PASSWORD: confirmation
    ports: ["5435:5432"]
    volumes:
      - confirmation_db_data:/var/lib/postgresql/data
      - ./confirmation_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confirmation -d confirmation"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build: ./gateway
    container_name: gateway
    ports: ["30000:8000"]
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - JWT_SECRET=super-secret-jwt-key-payment-system
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./gateway:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  auth_service:
    build: ./auth_service
    container_name: auth_service
    environment:
      - RABBITMQ_HOST=rabbitmq
      - DB_HOST=auth_db
      - DB_NAME=auth
      - DB_USER=auth
      - DB_PASSWORD=auth
      - JWT_SECRET=super-secret-jwt-key-payment-system
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth_db:
        condition: service_healthy
    volumes:
      - ./auth_service:/app
    command: python -u -m app.main

  accounts_service:
    build: ./accounts_service
    container_name: accounts_service
    environment:
      - RABBITMQ_HOST=rabbitmq
      - DB_HOST=accounts_db
      - DB_NAME=accounts
      - DB_USER=accounts
      - DB_PASSWORD=accounts
    depends_on:
      rabbitmq:
        condition: service_healthy
      accounts_db:
        condition: service_healthy
    volumes:
      - ./accounts_service:/app

  orders_service:
    build: ./orders_service
    container_name: orders_service
    environment:
      - RABBITMQ_HOST=rabbitmq
      - DB_HOST=orders_db
      - DB_NAME=orders
      - DB_USER=orders
      - DB_PASSWORD=orders
    depends_on:
      rabbitmq:
        condition: service_healthy
      orders_db:
        condition: service_healthy
    volumes:
      - ./orders_service:/app

  confirmation_service:
    build: ./confirmation_service
    container_name: confirmation_service
    environment:
      - RABBITMQ_HOST=rabbitmq
      - DB_HOST=confirmation_db
      - DB_NAME=confirmation
      - DB_USER=confirmation
      - DB_PASSWORD=confirmation
    depends_on:
      rabbitmq:
        condition: service_healthy
      confirmation_db:
        condition: service_healthy
    volumes:
      - ./confirmation_service:/app

  frontend:
    build: ./frontend
    container_name: frontend
    ports: ["30080:80"]
    environment:
      - PORT=80
      - GATEWAY_URL=http://gateway:8000
      - STORAGE_SECRET=payment-order-system-dev
    volumes:
      - ./frontend:/app
    depends_on:
      - gateway

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  auth_db_data:
  accounts_db_data:
  orders_db_data:
  confirmation_db_data: